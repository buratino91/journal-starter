name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs: # Each job runs in a separate runner
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Pyright type check
        run: uv run pyright

  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: career_journal
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Add aspire-dashboard service so that error messages will not be shown in the logs when running tests. 
      # The aspire-dashboard service is not used by the tests, but it is required by the OpenTelemetry SDK to export metrics and traces.    
      aspire-dashboard:
        image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
        ports:
          - 18888:18888
          - 4318:18890
          - 4317:18889

    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: career_journal
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/career_journal
      # Required by api.config.Settings so the app boots. Tests never call a
      # real LLM — Task 4 uses an injected MockAsyncOpenAI client — so any
      # non-empty value works.
      OPENAI_API_KEY: ci-placeholder-not-used-by-mock
      OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4317

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Initialize database schema
        run: |
          PGPASSWORD=postgres psql \
            -h localhost -U postgres -d career_journal \
            -f database_setup.sql

      - name: Run tests
        run: uv run pytest -v

  build-and-push:
    permissions:
      contents: read
      packages: write
      id-token: write
    runs-on: ubuntu-latest  
    needs: test
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          audience: sts.amazonaws.com
          role-to-assume: arn:aws:iam::394151408055:role/GIthub-OIDC-Role
          aws-region: us-east-1

      - name: Login to Amazon ECR private
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, tag, and push image to Amazon ECR and GHCR
        env:
            REGISTRY: ${{ steps.login-ecr.outputs.registry }}
            REPOSITORY: l2c/journal-app
            GHCR_IMAGE: ghcr.io/${{ github.repository }}/journal-app
            IMAGE_TAG: latest
        run: |
            GHCR_IMAGE="$(printf '%s' "$GHCR_IMAGE" | tr '[:upper:]' '[:lower:]')"
            docker build \
            -t "$REGISTRY/$REPOSITORY:$IMAGE_TAG" \
            -t "$GHCR_IMAGE:$IMAGE_TAG" \
            .

            docker push "$REGISTRY/$REPOSITORY:$IMAGE_TAG"
            docker push "$GHCR_IMAGE:$IMAGE_TAG"
    
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    
    permissions:
      id-token: write
      contents: read
    
    environment:
      name: production
      url: https://

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Install helm
        run: |
          HELM_BUILDKITE_APT_KEY_ID="DDF78C3E6EBB2D2CC223C95C62BA89D07698DBC6"
          sudo apt-get install curl gpg apt-transport-https --yes
          curl -fsSL https://packages.buildkite.com/helm-linux/helm-debian/gpgkey > "${TMPDIR:-/tmp}/helm.gpg"
          if [ "$(gpg --show-keys --with-colons "${TMPDIR:-/tmp}/helm.gpg" | awk -F: '$1 == "fpr" {print $10}' | head -n 1)" != "${HELM_BUILDKITE_APT_KEY_ID}" ]; then echo "ERROR: Unexpected Helm APT key ID: potential key compromise"; exit 1; fi
          cat "${TMPDIR:-/tmp}/helm.gpg" | gpg --dearmor | sudo tee /usr/share/keyrings/helm.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/helm.gpg] https://packages.buildkite.com/helm-linux/helm-debian/any/ any main" | sudo tee /etc/apt/sources.list.d/helm-stable-debian.list

          sudo apt-get update
          sudo apt-get install helm

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with: 
          audience: sts.amazonaws.com
          role-to-assume: arn:aws:iam::394151408055:role/GIthub-OIDC-Role
          aws-region: us-east-1

      - name: Connect kubectl to EKS
        run: |
          aws eks update-kubeconfig \
            --name journal-api-eks \
            --region us-east-1

      # - name: Deploy using helm
        